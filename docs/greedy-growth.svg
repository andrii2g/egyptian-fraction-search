<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="642" viewBox="0 0 1000 642" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Egyptian fraction comparison for 4/17</title>
<desc id="chart-desc">Comparison of 2 exact decompositions of 4/17. Each aligned bar represents the entire target fraction. Segment widths are proportional; full unit labels, term counts, and largest denominators are shown. Search: optimal within bounds; objective: pareto; denominator &lt;= 200; terms &lt;= 4. Greedy: complete.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#24324a}.heading{font-size:26px;font-weight:700}.label{font-size:16px;font-weight:700}.muted{font-size:13px;fill:#63718a}.mono{font-family:Consolas,monospace;font-size:13px}.key{font-family:Consolas,monospace;font-size:12.5px}</style></defs>
<rect width="1000" height="642" fill="#f3f5fa"/>
<text class="heading" x="52" y="54">Egyptian fraction comparison</text>
<text class="mono" x="52" y="84"><tspan x="52" dy="0">Target: 4/17</tspan></text>
<text class="muted" x="52" y="110"><tspan x="52" dy="0">Search: optimal within bounds; objective: pareto; denominator &lt;= 200; terms &lt;= 4. Greedy: complete.</tspan></text>
<text class="muted" x="52" y="138"><tspan x="52" dy="0">Each full bar represents the target fraction. Colored segments show the proportional shares of its distinct</tspan><tspan x="52" dy="18">unit fractions.</tspan></text>
<rect class="panel" x="24" y="192" width="952" height="177" rx="14" fill="#ffffff" stroke="#dce2ee"/>
